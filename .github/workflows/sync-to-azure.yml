name: Sync to Azure Repos

on:
  push:
    branches:
      - '**' # This makes the workflow run on ANY branch push, keeping everything synced

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Mirror to Azure DevOps
        env:
          AZURE_TOKEN: ${{ secrets.AZURE_DEVOPS_TOKEN }}
        run: |
          # 1. Safety check for the token
          if [ -z "$AZURE_TOKEN" ]; then
            echo "ERROR: AZURE_DEVOPS_TOKEN secret is empty in GitHub Settings!"
            exit 1
          fi

          # 2. Get the exact name of the current branch being pushed (e.g., main or master)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Syncing active branch: $BRANCH_NAME"

          # 3. Assemble variables and encode project spaces
          ORG="ST10446802"
          PROJECT="DISASTER%20RELIEF%20MANAGEMENT%20WEB%20APPLICATION%20POE"
          REPO="GiftOfTheGivers"
          
          # 4. Build the target URL string
          TARGET_URL="https://x-token-auth:${AZURE_TOKEN}@://azure.com{ORG}/${PROJECT}/_git/${REPO}"
          
          # 5. Push the exact matching branch directly to Azure
          git push "$TARGET_URL" "$BRANCH_NAME:$BRANCH_NAME" --force
