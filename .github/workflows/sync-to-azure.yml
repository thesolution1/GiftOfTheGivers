name: Sync to Azure Repos

on:
  push:
    branches:
      - master 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Mirror to Azure DevOps
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Wrap the URL tightly in double quotes to prevent spaces from breaking the script
          # Spaces are safely converted to '%20' so the URL loads correctly
          AZURE_URL="https://x-token-auth:${{ secrets.AZURE_TOKEN }}@://azure.com"
          
          # Push the code using the corrected URL format
          git push "$AZURE_URL" HEAD:main
