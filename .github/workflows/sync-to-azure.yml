name: Sync to Azure Repos

on:
  push:
    branches:
      - master 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Mirror to Azure DevOps
        env:
          # Injecting the secret as an environment variable prevents bash evaluation bugs
          AZURE_TOKEN: ${{ secrets.AZURE_DEVOPS_TOKEN }}
        run: |
          # 1. Fallback safety check if the secret fails to load
          if [ -z "$AZURE_TOKEN" ]; then
            echo "ERROR: AZURE_DEVOPS_TOKEN secret is empty or missing in GitHub Settings!"
            exit 1
          fi

          # 2. Safely structure the target organization, project, and repository names
          ORG="ST10446802"
          PROJECT="DISASTER RELIEF MANAGEMENT WEB APPLICATION POE"
          REPO="GiftOfTheGivers"
          
          # 3. Use standard web-encoding to convert spaces to %20
          ENCODED_PROJECT=$(echo "$PROJECT" | sed 's/ /%20/g')
          
          # 4. Assemble the authenticated target URL string
          TARGET_URL="https://x-token-auth:${AZURE_TOKEN}@://azure.com{ORG}/${ENCODED_PROJECT}/_git/${REPO}"
          
          # 5. Push the code cleanly
          git push "$TARGET_URL" HEAD:main --force
