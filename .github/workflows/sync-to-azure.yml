name: Sync to Azure Repos

on:
  push:
    branches:
      - '**' # Syncs any branch that gets pushed

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Mirror to Azure DevOps
        # This third-party action processes URLs natively to avoid shell syntax corruption
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: "https://azure.com"
          user: "x-token-auth"
          password: ${{ secrets.AZURE_DEVOPS_TOKEN }}
