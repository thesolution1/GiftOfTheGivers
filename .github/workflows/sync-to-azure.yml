name: Sync to Azure Repos

on:
  push:
    branches:
      - master # Change this if your default branch is named master or something else

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so all commits sync properly

      - name: Mirror to Azure DevOps
        run: |
          # Format the Azure URL to include authentication
          # Replace <ORGANIZATION>, <PROJECT>, and <REPO_NAME> with your actual Azure details
          AZURE_URL="https://x-token-auth:${{ secrets.AZURE_DEVOPS_TOKEN }}@://azure.com<ST10446802>/<DISASTER RELIEF MANAGEMENT WEB APPLICATION POE>/_git/<GiftOfTheGivers>"
          
          # Force push the main branch to Azure
          git push $AZURE_URL main --force
