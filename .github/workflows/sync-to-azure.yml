name: Sync to Azure Repos

on:
  push:
    branches:
      - master 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Mirror to Azure DevOps
        run: |
          # 1. Clear out any global insteadOf configurations that are breaking the URL parser
          git config --global --unset-all url.https://.insteadof || true
          
          # 2. Configure a completely fresh local remote to bypass global cache bugs
          git remote add azure_target "https://x-token-auth:${{ secrets.AZURE_TOKEN }}@://azure.com"
          
          # 3. Explicitly push to the newly created target
          git push azure_target HEAD:main --force
