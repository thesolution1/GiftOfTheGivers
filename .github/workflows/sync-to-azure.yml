name: Sync to Azure Repos

on:
  push:
    branches:
      - master 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Mirror to Azure DevOps
        env:
          AZURE_TOKEN: ${{ secrets.AZURE_DEVOPS_TOKEN }}
        run: |
          # 1. FORCE CLEAR the broken global Git url-rewriting rules that are causing the crash
          git config --global --unset-all url.https://.insteadof || true
          git config --global --remove-section url || true
          
          # 2. Check if the secret is loading correctly
          if [ -z "$AZURE_TOKEN" ]; then
            echo "ERROR: AZURE_DEVOPS_TOKEN secret is empty in GitHub Settings!"
            exit 1
          fi

          # 3. Assemble variables and encode project spaces natively
          ORG="ST10446802"
          PROJECT="DISASTER%20RELIEF%20MANAGEMENT%20WEB%20APPLICATION%20POE"
          REPO="GiftOfTheGivers"
          
          # 4. Build the exact URL string
          TARGET_URL="https://x-token-auth:${AZURE_TOKEN}@://azure.com{ORG}/${PROJECT}/_git/${REPO}"
          
          # 5. Push using an isolated temporary remote to ignore global system configurations completely
          git remote add temporary_azure "$TARGET_URL"
          git push temporary_azure HEAD:
