name: Build and test

on:
  push:
    branches:
      - Siphesihle
      - main
      - master
  pull_request:
    branches:
      - Siphesihle
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore GiftOfTheGivers.sln

      - name: Build solution
        run: dotnet build GiftOfTheGivers.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj --configuration Release --no-build --verbosity normal
