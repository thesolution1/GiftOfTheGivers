name: Mirror to Azure DevOps

on:
  push:
    branches:
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # Using a dedicated node action completely isolates the push from the local Git config engine
      - name: Mirror to Azure Repos
        uses: yesoreyeram/github-repository-mirror@v2.2.0
        with:
          target_repo_url: "https://azure.com"
          target_username: "x-token-auth"
          target_token: ${{ secrets.AZURE_DEVOPS_TOKEN }}
