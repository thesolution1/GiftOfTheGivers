name: Mirror to Azure DevOps

on:
  push:
    branches:
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Clean Cache and Force Push
        env:
          TOKEN: ${{ secrets.AZURE_DEVOPS_TOKEN }}
        run: |
          # 1. Purge the sticky configuration cache file
          rm -rf .git/config

          # 2. Re-initialize a pristine Git tracking profile
          git init
          
          # 3. Assemble your true, correct ://azure.com path
          TARGET_URL="https://x-token-auth:${TOKEN}@://azure.com/ST10446802/DISASTER%20RELIEF%20MANAGEMENT%20WEB%20APPLICATION%20POE/_git/GiftOfTheGivers"
          
          # 4. Push your local files out immediately over the clean channel
          git push "$TARGET_URL" HEAD:master --force
